<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dog Object Finder</title>
</head>
<body>
    <h1>Unity Object Finder</h1>
    <form id="control_robot" method="POST" action="/submit_command">
        <label for="command">Enter Command:</label>
        <input type="text" id="command" name="command" required>
        <button type="submit">Submit</button>
    </form>

    <h2>Status</h2>
    <p id="status"></p>
    <br>
    <canvas id="image-canvas" style="border:1px solid #000000;">
    </canvas>
    <h2>Bounding Box</h2>
    <p id="bbox"></p>
    <br>

    <script>
        function SubmitForm(form)
        {
            const formData = new FormData(form);
            fetch('/submit_command',
            {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data =>
            {
                if (data.status)
                {
                    document.getElementById('status').innerText = data.status;
                }
                if (data.image)
                {
                    if (data.bbox &&
                        (data.bbox[0] != null) &&
                        (data.bbox[1] != null) &&
                        (data.bbox[2] > 0) &&
                        (data.bbox[3] > 0))
                    {
                        boxstr = "Bounding Box: " + data.bbox[0] + ", " + data.bbox[1] + ", " + data.bbox[2] + ", " + data.bbox[3]; 
                        document.getElementById('bbox').innerText = boxstr; 
                        displayImage(data.image, data.bbox);
                    }
                    else
                    {
                        displayImage(data.image, [0, 0, 0, 0]);
                        document.getElementById('bbox').innerText = 'No bounding box found.';
                        if (data.action == 'resubmit')
                        {
                            SubmitForm(form);
                        }
                    }
                }
            })
            .catch(error =>
            {
                console.error('Error:', error);
                document.getElementById('status').innerText = 'Error: ' + error;
            });            
        }

        function onSubmit(event)
        {
            event.preventDefault(); // Prevent the default form submission
            SubmitForm(document.getElementById('control_robot'));
        }

        document.getElementById('control_robot').addEventListener('submit', onSubmit);

        function displayImage(image_data, bbox)
        {
            const canvas = document.getElementById('image-canvas');
            const ctx = canvas.getContext('2d');
            const image = new Image();

            // Set up the image source
            image.onload = function ()
            {
                // Set canvas size to match the image
                canvas.width = image.width;
                canvas.height = image.height;

                // Draw the image on the canvas
                ctx.drawImage(image, 0, 0);

                if (bbox[2] > 0 && bbox[3] > 0)
                {
                    // Draw the bounding box
                    ctx.strokeStyle = 'red';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(bbox[0], bbox[1], bbox[2], bbox[3]);
                }
            }
            image.src = image_data;
        }
    </script>
</body>
</html>
